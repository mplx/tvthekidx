name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  build:
    name: Build & Lint (trixie)
    runs-on: ubuntu-latest
    container:
      image: python:3-slim-trixie
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install system dependencies
        run: apt-get install -y --no-install-recommends binutils zlib1g-dev libjpeg-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint — pylint
        run: pylint --errors-only --disable import-error src/tvthekidx/*.py

      - name: Lint — flake8
        run: flake8 src/tvthekidx/*.py --ignore=E501,E722 --statistics --count

      - name: Build binary
        run: |
          pip install -e .
          pyinstaller --clean tvthekidx.spec
          mv dist/tvthekidx dist/tvthekidx-trixie

      - uses: actions/upload-artifact@v7
        with:
          name: tvthekidx-trixie
          path: dist/tvthekidx-trixie
          retention-days: 1

  test:
    name: Test (trixie)
    runs-on: ubuntu-latest
    needs: build
    container:
      image: debian:trixie-slim
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tvthekidx-trixie

      - name: Run binary
        run: |
          chmod +x tvthekidx-trixie
          ./tvthekidx-trixie -h

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: tvthekidx-trixie

      - name: Build source distribution
        run: |
          pip install build
          python -m build --sdist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            tvthekidx-trixie \
            dist/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build packages
        run: |
          pip install build
          python -m build

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload dist/*
