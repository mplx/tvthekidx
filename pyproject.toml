[project]
name = "tvthekidx"
description = "maintain an index of downloaded tvthek content"
readme = "README.md"
license = {text = "LGPL-3.0-only"}
keywords = ["tvthek", "movies"]
authors = [
  {name = "mplx", email = "developer@mplx.eu" }
]

requires-python = ">=3.9"

dynamic = ["version"]

dependencies = [
  "tmdbv3api==1.7.7",
  "ffmpeg-python==0.2.0",
  "moviepy==1.0.3",
  "pillow==12.2.0",
]

# https://pypi.org/classifiers/
classifiers = [
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities"
]

[project.optional-dependencies]
tvstation = ["ultralytics==8.4.22"]

# https://packaging.python.org/specifications/core-metadata/#project-url-multiple-use
# https://packaging.python.org/specifications/core-metadata/#home-page-optional
[project.urls]
"Homepage" = "https://gitlab.mplx.eu/scripts/tvthekidx"
"Source" = "https://gitlab.mplx.eu/scripts/tvthekidx"

[project.scripts]
tvthekidx = "tvthekidx.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/tvthekidx/_version.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.1"
include = [
  "/src",
  "/tests",
  "/docs",
  "/CHANGELOG.md",
  "/README.md",
  "/LICENSE",
  "/requirements.txt",
  "/requirements-dev.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.1"
