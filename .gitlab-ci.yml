stages:
  - lint
  - build
  - test
  - release

# --- LINT -----------------------------------------------------------------------------------

linter:
  stage: lint
  image: python:3-slim-buster
  tags:
    - docker-build
  script:
    - pip install --upgrade pip
    - python --version && pip --version
    - pip install -r requirements.txt
    - pip install -U pylint flake8
    - pylint --version && pylint -E src/*.py
    - flake8 --version && flake8 src/*.py --ignore=E501 --statistics --count

# --- BUILD ----------------------------------------------------------------------------------

build-win-x64:
    stage: build
    image: docker:20.10.19-dind
    tags:
        - docker-build
    services:
        - name: docker:20.10.19-dind
          alias: docker
    artifacts:
        expire_in: 1 hour
        paths:
            - dist/win64/
    script:
        - docker run --rm -v "$(pwd):/src" ghcr.io/mplx/docker-pyinstaller:master-py3-win64

build-debian-buster-x64:
    stage: build
    image: python:3-slim-buster
    tags:
        - docker-build
    artifacts:
        expire_in: 1 hour
        paths:
            - dist
    before_script:
        - apt update && apt install -y binutils
    script:
        - pip install -r requirements.txt
        - pip install -U pyinstaller
        - pyinstaller --clean tvthekidx.spec
        - mv dist/tvthekidx dist/tvthekidx-buster

build-debian-bullseye-x64:
    stage: build
    image: python:3-slim-bullseye
    tags:
        - docker-build
    artifacts:
        expire_in: 1 hour
        paths:
            - dist
    before_script:
        - apt update && apt install -y binutils
    script:
        - pip install -r requirements.txt
        - pip install -U pyinstaller
        - pyinstaller --clean tvthekidx.spec
        - mv dist/tvthekidx dist/tvthekidx-bullseye

# --- TEST -----------------------------------------------------------------------------------

test-debian-buster-on-buster-x64:
    stage: test
    image: debian:buster-slim
    tags:
        - docker-build
    variables:
        GIT_STRATEGY: none
    script:
        - dist/tvthekidx-buster -h
    needs:
        - job: build-debian-buster-x64
          artifacts: true

test-debian-buster-on-bullseye-x64:
    stage: test
    image: debian:buster-slim
    tags:
        - docker-build
    variables:
        GIT_STRATEGY: none
    script:
        - dist/tvthekidx-buster -h
    needs:
        - job: build-debian-buster-x64
          artifacts: true

test-debian-bullseye-on-bullseye-x64:
    stage: test
    image: debian:bullseye-slim
    tags:
        - docker-build
    variables:
        GIT_STRATEGY: none
    script:
        - dist/tvthekidx-bullseye -h
    needs:
        - job: build-debian-bullseye-x64
          artifacts: true

test-debian-bullseye-on-buster-x64:
    stage: test
    image: debian:buster-slim
    tags:
        - docker-build
    variables:
        GIT_STRATEGY: none
    rules:
        - allow_failure: true
    script:
        - dist/tvthekidx-bullseye -h
    needs:
        - job: build-debian-bullseye-x64
          artifacts: true

# --- RELEASE --------------------------------------------------------------------------------

release:
    stage: release
    image: gmitirol/alpine312:v1
#    image: registry.gitlab.com/gitlab-org/release-cli:latest
    tags:
        - docker-deploy
    needs:
        - job: linter
        - job: build-debian-buster-x64
          artifacts: true
        - job: build-win-x64
          artifacts: true
        - job: test-debian-buster-on-buster-x64
          artifacts: false
    rules:
        - if: $CI_COMMIT_TAG =~ /^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9a-zA-Z.-]+))?$/
    variables:
        GIT_STRATEGY: none
        PACKAGE_API_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
    script:
        - |
            uploadFiles=(
                dist/tvthekidx-buster::tvthekidx-debian-amd64
                dist/win64/tvthekidx.exe::tvthekidx-windows-amd64.exe
            )
            for uploadFile in ${uploadFiles[@]}; do
                uploadLine=($(echo "$uploadFile" | tr '::' '\n'))
                echo uploading ${uploadLine[0]} -> ${uploadLine[1]}
                curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file ${uploadLine[0]} ${PACKAGE_API_URL}/bin/${CI_COMMIT_TAG}/${uploadLine[1]}
            done
